---
- name: Flux Smoke Test on all nodes
  hosts: all
  become: yes
  roles:
    - flux_test

- name: Flux Broker & Job Test on Head Node
  hosts: slurm-node-1
  become: yes

  tasks:
    - name: Start flux broker in background
      shell: |
        . /etc/profile.d/flux.sh
        nohup flux start &>/tmp/flux-start.log &
      args:
        executable: /bin/bash
      async: 10
      poll: 0

    - name: Wait for flux broker socket (head node only)
      ansible.builtin.wait_for:
        path: /run/flux/local
        timeout: 30

    - name: Submit a simple hostname job
      shell: |
        . /etc/profile.d/flux.sh
        flux submit hostname
      register: hostname_job
      changed_when: false

    - name: Show flux job output
      debug:
        msg: "{{ hostname_job.stdout }}"