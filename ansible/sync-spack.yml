- name: Package and distribute Spack and flux.sh to compute nodes
  hosts: all
  become: true
  tasks:
    - name: Set headnode fact
      ansible.builtin.set_fact:
        is_headnode: "{{ inventory_hostname == 'slurm-node-1' }}"

    - name: Tar up Spack and flux environment on head node
      ansible.builtin.shell: |
        tar czf /data/packages/spack_flux_bundle.tar.gz -C / opt/spack etc/profile.d/flux.sh
      args:
        creates: /data/packages/spack_flux_bundle.tar.gz
      when: is_headnode

    - name: Ensure extract destination exists on compute nodes
      ansible.builtin.file:
        path: /opt
        state: directory
        mode: '0755'
      when: not is_headnode

    - name: Extract spack and flux environment from archive
      ansible.builtin.unarchive:
        src: /data/packages/spack_flux_bundle.tar.gz
        dest: /
        remote_src: true
      when: not is_headnode
