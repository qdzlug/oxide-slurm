---
# Common tasks

# Install packages on head_node (controller)
- name: Install packages on headnode
  ansible.builtin.apt:
    name:
      - bzip2
      - python3
      - gcc
      - openssl
      - numactl
      - hwloc
      - lua5.3
      - man2html
      - make
      - ruby
      - ruby-dev
      - libmunge-dev
      - libpam0g-dev
      - libdbus-1-dev
      - wget
      - dpkg-dev
      - mariadb-server
      - mariadb-client
      - libmariadb-dev
      - munge
      - libmunge2
      - nfs-kernel-server
      - nfs-common
    state: present
    update_cache: true
  when: inventory_hostname in groups['head_node']

# Minimal package set for compute nodes
- name: Install required packages for compute nodes
  ansible.builtin.apt:
    name:
      - bzip2
      - python3
      - munge
      - libmunge2
      - nfs-common
    state: present
    update_cache: true
  when: inventory_hostname in groups['compute']

# Update /etc/hosts for internal resolution
- name: Add internal hostnames and IP addresses to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE HOSTS BLOCK"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host].ansible_default_ipv4.address }} {{ hostvars[host].inventory_hostname }}
      {% endfor %}

# User and Group Setup
- name: Ensure slurm group exists with GID 967
  ansible.builtin.group:
    name: slurm
    gid: 967
    state: present

- name: Ensure slurm user exists with UID 967
  ansible.builtin.user:
    name: slurm
    uid: 967
    group: slurm
    home: /var/lib/slurm
    shell: /bin/bash
    comment: "SLURM workload manager"
    create_home: true
    state: present

- name: Add ubuntu to the slurm group
  ansible.builtin.user:
    name: ubuntu
    groups: slurm
    append: true
  become: true
